[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "investment-research-engine"
version = "0.1.0"
description = "A research terminal for equities and prediction markets"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jeremy D. Wu" }]
keywords = ["investment-research", "equity-screening", "prediction-markets", "macro"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Office/Business :: Financial :: Investment",
  "Development Status :: 3 - Alpha",
]
dependencies = ["pandas>=2.0", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["product*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
